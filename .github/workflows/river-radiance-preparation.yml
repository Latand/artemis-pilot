name: Bounded owner-radiance preparation proof
on:
  push:
    branches: [diagnostic/river-radiance-preparation-only]
permissions:
  contents: read
jobs:
  desktop-proxima-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node scripts/smoke-river-radiance-paired.mjs && node scripts/smoke-river-radiance-preparation.mjs
      - run: npx playwright install --with-deps chromium
      - name: Preserve untimed full preparation and diagnostic synchronized cost
        run: |
          git worktree add --detach ../radiance-baseline 09863eedda25eef36d79e9cf88daa4ff3e377875
          ln -s "$GITHUB_WORKSPACE/node_modules" ../radiance-baseline/node_modules
          BASE_ROOT="$GITHUB_WORKSPACE/../radiance-baseline" node scripts/probe-river-radiance-preparation.mjs . evidence/preparation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radiance-desktop-proxima-preparation
          path: evidence/preparation
          retention-days: 14
