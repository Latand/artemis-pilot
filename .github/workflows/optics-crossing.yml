name: Black-hole optics crossing diagnostic
on:
  pull_request:
    paths:
      - 'scripts/probe-optics-crossing.mjs'
      - 'scripts/smoke-optics-crossing.mjs'
      - 'src/lensing.js'
      - 'src/holeOptics.js'
      - 'src/tdeVisuals.js'
      - 'src/render/ringSamplingDepth.js'
      - 'src/render/planetAppearance.js'
      - 'scripts/smoke-ring-sampling-depth.mjs'
      - '.github/workflows/optics-crossing.yml'
permissions:
  contents: read
concurrency:
  group: optics-crossing-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  capture:
    name: Optics crossing ${{ matrix.device }} / bloom-${{ matrix.bloom }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
        bloom: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node scripts/smoke-optics-crossing.mjs && node scripts/smoke-ring-sampling-depth.mjs && node scripts/smoke-hole-appearance.mjs && node scripts/smoke-hole-precision.mjs && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Frozen Saturn and disk plane-crossing ablations
        env:
          DEVICE: ${{ matrix.device }}
          BLOOM: ${{ matrix.bloom }}
          ARTEMIS_EVIDENCE: evidence/optics-crossing
        run: node scripts/probe-optics-crossing.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optics-crossing-metrics-${{ matrix.device }}-bloom-${{ matrix.bloom }}
          path: evidence/optics-crossing/report.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optics-crossing-saturn-${{ matrix.device }}-bloom-${{ matrix.bloom }}
          path: evidence/optics-crossing/saturn-*.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optics-crossing-disk-${{ matrix.device }}-bloom-${{ matrix.bloom }}
          path: evidence/optics-crossing/disk-*.png
          if-no-files-found: error
          retention-days: 14
