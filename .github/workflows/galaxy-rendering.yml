name: Milky Way rendering regression

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'
      - 'vite.config.js'
      - '.github/workflows/galaxy-rendering.yml'

permissions:
  contents: read

concurrency:
  group: galaxy-rendering-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Syntax, model, cache and light-budget regressions
        run: |
          node --check src/render/galaxyVolume.js
          node --check scripts/verify-galaxy-rendering.mjs
          node --check scripts/capture-galaxy-app-routes.mjs
          node scripts/smoke-galaxy-continuity.mjs
          npm test
          npm run smoke:galaxy-model
          npm run smoke:galaxy-population
          npm run smoke:brightness
          npm run smoke:scaleladder
          npm run smoke:determinism
          npm run build
  browser:
    needs: model
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        revision: [before, after]
        suite: [regression, app]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Preserve exact source and dependency identities
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVISION: ${{ matrix.revision }}
        run: |
          mkdir -p evidence/sources
          git rev-parse HEAD > evidence/sources/head-sha.txt
          printf '%s\n' "$BASE_SHA" > evidence/sources/base-sha.txt
          cp package-lock.json evidence/sources/
          git diff "$BASE_SHA" HEAD > evidence/sources/implementation.diff
          git archive --format=tar.gz -o evidence/sources/rendering-source.tar.gz HEAD src/render src/universe/galaxyModel.js scripts/galaxy-preview-plugin.mjs scripts/verify-galaxy-rendering.mjs scripts/capture-galaxy-app-routes.mjs vite.config.js
          if [ "$REVISION" = before ]; then
            git worktree add --detach "$RUNNER_TEMP/galaxy-baseline" "$BASE_SHA"
            ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/galaxy-baseline/node_modules"
            echo "CAPTURE_ROOT=$RUNNER_TEMP/galaxy-baseline" >> "$GITHUB_ENV"
            echo "BASELINE=1" >> "$GITHUB_ENV"
          else
            echo "CAPTURE_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
      - run: npx playwright install --with-deps chromium
      - name: Browser assertions or full-application route captures
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$SUITE" = regression ]; then
            timeout --signal=SIGINT --kill-after=15s 12m node scripts/verify-galaxy-rendering.mjs "$CAPTURE_ROOT" evidence/rendering
          else
            timeout --signal=SIGINT --kill-after=15s 12m node scripts/capture-galaxy-app-routes.mjs "$CAPTURE_ROOT" evidence/app
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galaxy-${{ matrix.suite }}-${{ matrix.revision }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
