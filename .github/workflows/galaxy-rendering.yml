name: Milky Way rendering regression

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/galaxy-rendering.yml'

permissions:
  contents: read

concurrency:
  group: galaxy-rendering-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Preserve dependency versions for offline comparison
        run: |
          mkdir -p evidence/runtime
          tar -czf evidence/runtime/dependencies.tar.gz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: galaxy-comparison-runtime
          path: evidence/runtime/
          retention-days: 3
      - name: Model and light-budget regressions
        run: |
          npm test
          npm run smoke:galaxy-model
          npm run smoke:galaxy-population
          npm run smoke:brightness
          npm run smoke:scaleladder
          npm run smoke:determinism
      - run: npm run build
      - name: Browser regression when present
        run: |
          if test -f scripts/verify-galaxy-continuity.mjs; then
            npx playwright install --with-deps chromium
            node scripts/verify-galaxy-continuity.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galaxy-rendering-evidence
          path: evidence/galaxy/
          if-no-files-found: ignore
          retention-days: 14
