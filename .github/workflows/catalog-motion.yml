name: Catalog star motion
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/*catalog-motion*'
      - '.github/workflows/catalog-motion.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-motion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  canonical-state-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node scripts/smoke-catalog-motion.mjs && npm run smoke:explored-systems && npm run smoke:galaxy-dynamics && npm run smoke:tier1-runtime && npm run smoke:tier1-queryable && npm run smoke:determinism && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-catalog-motion.mjs . evidence/catalog-motion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-motion-evidence
          path: evidence/
          retention-days: 14
