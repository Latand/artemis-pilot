          3dc4030f422dc1b27df12cfb897fe8c230fd69d5 scripts/disk-plane-source-contract.mjs
          efa6c4f34dc03cfc6fbf450412a1cd61a5662695 scripts/fixtures/disk-plane-inputs.json
          dd7bcd9c7186a3e2c7a51c2603cbb5929cdcb779 scripts/native-ring-proof.mjs
          9b1c9e8416830089399d1b16771ec84339bce734 scripts/probe-disk-plane.mjs
          140d782ca9943a049e5f5717a3ff1c9a464a79e6 scripts/smoke-disk-plane-cost-contract.mjs
          4a388d20af019eb3739fe931019acb30af30d28d scripts/smoke-disk-plane-finalize.mjs
          9f7baa8a1e619c31a45863778f819e3b8bd0514b scripts/smoke-disk-plane-qa.mjs
          406d12c5f2325c9d8547ce676c6e03ecdb033c4b scripts/smoke-disk-plane-support.mjs
          fd596093a218d38a8900d3b7cd93d82c5c4667c0 src/holeOptics.js
          99bd167c75ebe2a5fe636730fa5774204e663ae3 docs/disk-pointer-fixture.md
          701eba17c955bdd85f907d71fe66d8c8042c4e6b scripts/disk-pointer-fixture.mjs
          cbcc474ae36b178030b4a21452e1679ce02e8b25 scripts/smoke-disk-pointer-fixture.mjs
          8afd78317112310a4338321ba7787ebd1c0026e7 docs/qa/disk-unclipped-proof.md
          03bc0158b8cb5abbb2f6c4fc681ee3a42f8d2272 docs/qa/native-disk-proof.md
          4f0b441aea1df4bb01e94ce64ee0be3160896159 scripts/smoke-disk-frustum-fast-path.mjs
          b1c238f9a7331c868152c13d0fcc1a185067d989 scripts/smoke-disk-fast-path-lifecycle.mjs
          38782d9c21690fbf5c49599e87d7dd357152d757 scripts/smoke-disk-program-precision.mjs
          caddb54031b4c7cbc73e92bf4fcfb6c80f57dd35 scripts/smoke-disk-source-binding.mjs
          8a0927700fe7e09b8cb7d11e85459cd43c27acfb scripts/fixtures/disk-fast-path-captured.json
          18a5d792a0c1ec3e1f23f63892949d35596a54f1 scripts/native-disk-proof.mjs
          5e15c7d094107082d9594a4c3ead2c1d9523fe0c scripts/smoke-native-disk-proof.mjs
          BLOBS
