          set -euo pipefail
          node scripts/probe-disk-plane.mjs --validate > "$ARTEMIS_EVIDENCE/source-after.json"
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 2
        with:
          name: disk-plane-cost-${{ matrix.device }}-${{ matrix.bloom }}-${{ github.sha }}
          path: |
            evidence/disk-cost/
            evidence/disk-cost-hooks/
          if-no-files-found: error
          retention-days: 14
          # Failed original reports remain failed. No outlier removal,
          # replacement trial, rerun-for-green or automatic release follows.
