          git worktree add --detach "$RUNNER_TEMP/disk-plane-main" "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/disk-plane-main/node_modules"
          echo "BASE_ROOT=$RUNNER_TEMP/disk-plane-main" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0 playwright-core@1.63.0 three@0.164.1 vite@5.4.21
          test ! -e package-lock.json
          node --input-type=module <<'NODE' > "$ARTEMIS_EVIDENCE/runtime.json"
          import assert from 'node:assert/strict';
          import {readFileSync,realpathSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const expected={playwright:'1.63.0','playwright-core':'1.63.0',three:'0.164.1',vite:'5.4.21'};
          const actual={},packageJsonHashes={};
          for(const [name,version] of Object.entries(expected)){
           const bytes=readFileSync(`node_modules/${name}/package.json`);actual[name]=JSON.parse(bytes).version;
           assert.equal(actual[name],version);packageJsonHashes[name]=createHash('sha256').update(bytes).digest('hex');
          }
          const bytes=readFileSync('node_modules/playwright-core/browsers.json');
          const browsers=JSON.parse(bytes).browsers;
          for(const name of ['chromium','chromium-headless-shell']){
           const browser=browsers.find(b=>b.name===name);assert.equal(browser.revision,'1243');assert.equal(browser.browserVersion,'153.0.8010.12');
          }
          assert.equal(realpathSync(process.env.RUNNER_TEMP+'/disk-plane-main/node_modules'),realpathSync('node_modules'));
          console.log(JSON.stringify({node:process.version,packages:actual,packageJsonHashes,browserManifestSha256:createHash('sha256').update(bytes).digest('hex'),chromium:'153.0.8010.12',revision:'1243'}));
          NODE
      - name: Verify numerical, source, native observer and finalizer controls
        timeout-minutes: 4
        run: |
          set -euo pipefail
          node scripts/probe-disk-plane.mjs --validate > "$ARTEMIS_EVIDENCE/source-before.json"
          node scripts/smoke-disk-plane-support.mjs --verify-main-scope
          node scripts/smoke-disk-plane-qa.mjs
          node scripts/smoke-disk-pointer-fixture.mjs
          node scripts/smoke-disk-plane-finalize.mjs
          node scripts/smoke-disk-plane-cost-contract.mjs
          node scripts/smoke-context-recovery-qa.mjs
          node scripts/smoke-hole-appearance.mjs
          node scripts/smoke-hole-precision.mjs
          node scripts/smoke-hole-emission.mjs
          npm run build
      - name: Install the pinned Chromium153 runtime
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Paired main/candidate crossing, foreground, ring and lifecycle pixels
        timeout-minutes: 20
        run: |
          set -euo pipefail
          node scripts/probe-disk-plane.mjs
      - name: Verify protected source and fixture bytes after execution
        timeout-minutes: 2
        if: always()
        run: |
          set -euo pipefail
          node scripts/probe-disk-plane.mjs --validate > "$ARTEMIS_EVIDENCE/source-after.json"
      - uses: actions/upload-artifact@v4
        if: always()
