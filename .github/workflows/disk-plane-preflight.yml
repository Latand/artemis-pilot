# One proposed QA-corrected cohort; preserve v4 oracle failure and all historical failures.
# Compile resets are linked to native submissions, including zero counts without uniform claims.
# Native proof observes existing untimed draws; no extra frames or warmup. Active hover or another
# exact-pixel mismatch stops this cohort; there is no automatic retry.
name: Disk-plane conservative fast path
# One reviewed push launches this bounded issue50-only cohort. No PR, manual,
# schedule, six-view radiance, deployment or branch-writing trigger is attached.
on:
  push:
    branches: ['diagnostic/disk-fast-path-6179-v5']
permissions:
  contents: read
concurrency:
  group: disk-plane-only-${{ github.ref }}
  cancel-in-progress: false
env:
  BASE_SHA: '6179f23661591bb4dee89a0bf8e686233e1ba280'
  CANDIDATE_ROOT: ${{ github.workspace }}
  EXPECTED_CANDIDATE_REVISION: ${{ github.sha }}
jobs:
  pixels:
    name: Disk-only pixels and recovery ${{ matrix.device }} / bloom-${{ matrix.bloom }}
    runs-on: ubuntu-latest
    # Fixed step caps total56 minutes, leaving4 for scheduling/cleanup.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
        bloom: [0, 1]
    env:
      DEVICE: ${{ matrix.device }}
      BLOOM: ${{ matrix.bloom }}
      ARTEMIS_EVIDENCE: '${{ github.workspace }}/evidence/disk-pixels'
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '22.23.3'
      - name: Pin reviewed source and prepare one shared runtime
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "$ARTEMIS_EVIDENCE"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
