          path: evidence/disk-pixels/candidate/original-saturn-foreground-lens-*.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 1
        with:
          name: disk-plane-candidate-original-saturn-overlapping-disk-${{ matrix.device }}-${{ matrix.bloom }}-${{ github.sha }}
          path: evidence/disk-pixels/candidate/original-saturn-overlapping-disk-*.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 1
        with:
          name: disk-plane-candidate-resize-1-${{ matrix.device }}-${{ matrix.bloom }}-${{ github.sha }}
          path: evidence/disk-pixels/candidate/resize-1-*.png
          if-no-files-found: warn
