          test "$(git log -1 --format=%H "$GITHUB_SHA" -- src/holeOptics.js)" = "$REVIEWED_SOURCE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$REVIEWED_SOURCE_SHA"
          git diff --exit-code "$REVIEWED_SOURCE_SHA" "$GITHUB_SHA" -- src public index.html package.json
          git diff --exit-code "$REVIEWED_PARENT_SHA" "$GITHUB_SHA" -- . ':(exclude).github/workflows/disk-plane-preflight.yml'
          test "$(git rev-parse "$BASE_SHA^{tree}")" = '423b008213ce603bf3a92eeea33af061a92a0df5'
          # Full checkout history must contain the immutable native optical harness.
          git cat-file -e 48a9da40a05b28cfd0d125b6107a771999fb784d^{commit}
          cat > "$ARTEMIS_EVIDENCE/reviewed-blobs.txt" <<'BLOBS'
          d6c22f113a4dfe5f53cd3c0bfc0a6ddcd99fe681 docs/qa/disk-plane-only.md
          cff455547ea07769b51e73ef4f49361028c672e4 scripts/benchmark-disk-plane.mjs
          d46364372ae063796f58c95c1810c8cf7a3036b3 scripts/disk-plane-finalize.mjs
