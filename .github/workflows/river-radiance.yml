name: Source radiance integration
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - 'bun.lock'
      - 'vite.config.*'
      - 'scripts/galaxy-preview-plugin.mjs'
      - '.env*'
      - 'postcss.config.*'
      - '.postcssrc*'
      - 'tsconfig*.json'
      - 'jsconfig*.json'
      - 'npm-shrinkwrap.json'
      - '.npmrc'
      - 'scripts/*radiance*'
      - 'scripts/fixtures/*radiance*'
      - 'scripts/context-recovery-qa.mjs'
      - 'scripts/smoke-context-recovery-qa.mjs'
      - '.github/workflows/river-radiance.yml'
permissions:
  contents: read
  actions: read
env:
  REVIEWED_BASE_REVISION: '6179f23661591bb4dee89a0bf8e686233e1ba280'
  PR_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
jobs:
  fresh-performance:
    name: Fresh radiance ${{ matrix.device }} ${{ matrix.fixture }}
    runs-on: ubuntu-latest
    timeout-minutes: 160
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
        fixture: [proxima, sun, black-hole]
    env:
      EXPECTED_CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
      DEVICE: ${{ matrix.device }}
      FIXTURE: ${{ matrix.fixture }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-package-lock
      - name: Prepare immutable protocol and actual main baseline
        run: |
          test "$PR_BASE_REVISION" = "$REVIEWED_BASE_REVISION"
          git worktree add --detach ../radiance-accepted 7d45c681f684da27bd84532e1de1d0ddd3f9564f
          git worktree add --detach ../travel-main 6179f23661591bb4dee89a0bf8e686233e1ba280
          ln -s "$GITHUB_WORKSPACE/node_modules" ../travel-main/node_modules
          ln -s "$GITHUB_WORKSPACE/node_modules" ../radiance-accepted/node_modules
      - name: Require unchanged guards, adapter negative controls and both production hooks
        run: |
          node scripts/smoke-radiance-acceptance.mjs
          node scripts/smoke-travel-radiance-adapter.mjs ../radiance-accepted ../travel-main
          node scripts/travel-radiance-adapter.mjs validate ../radiance-accepted ../travel-main . evidence/validation
      - run: npx playwright install --with-deps chromium
      - name: Measure every fresh warmup and all five paired trials
        run: node scripts/travel-radiance-adapter.mjs measure ../radiance-accepted ../travel-main . evidence/measured
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: travel-radiance-fresh-${{ matrix.device }}-${{ matrix.fixture }}
          path: evidence/measured/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: travel-radiance-validation-${{ matrix.device }}-${{ matrix.fixture }}
          path: evidence/validation/
          retention-days: 14
  fresh-aggregate:
    name: Fresh radiance complete ${{ matrix.device }}
    needs: fresh-performance
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
    env:
      EXPECTED_CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
      DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-package-lock
      - run: |
          test "$PR_BASE_REVISION" = "$REVIEWED_BASE_REVISION"
          git worktree add --detach ../radiance-accepted 7d45c681f684da27bd84532e1de1d0ddd3f9564f
          git worktree add --detach ../travel-main 6179f23661591bb4dee89a0bf8e686233e1ba280
      - uses: actions/download-artifact@v4
        with:
          pattern: travel-radiance-fresh-${{ matrix.device }}-*
          path: evidence/inputs
      - name: Recompute all three fresh views and the unchanged device-wide budget
        run: >-
          node scripts/travel-radiance-adapter.mjs aggregate ../radiance-accepted ../travel-main . evidence/aggregate
          evidence/inputs/travel-radiance-fresh-${{ matrix.device }}-proxima/report.json
          evidence/inputs/travel-radiance-fresh-${{ matrix.device }}-sun/report.json
          evidence/inputs/travel-radiance-fresh-${{ matrix.device }}-black-hole/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: travel-radiance-complete-${{ matrix.device }}
          path: evidence/aggregate/
          retention-days: 14
  final-functional:
    name: Final radiance ${{ matrix.suite }} ${{ matrix.device }}
    needs: fresh-aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
        suite: [transient, lifecycle]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-package-lock
      - run: node scripts/smoke-river-radiance.mjs && node scripts/smoke-river-radiance-qa.mjs && node scripts/smoke-river-radiance-lifecycle.mjs && node scripts/smoke-context-recovery-qa.mjs
      - run: npx playwright install --with-deps chromium
      - name: Exercise exact final production with the unchanged reviewed browser suite
        env:
          DEVICE: ${{ matrix.device }}
          RADIANCE_SUITE: ${{ matrix.suite }}
        run: |
          test "$PR_BASE_REVISION" = "$REVIEWED_BASE_REVISION"
          git worktree add --detach ../radiance-baseline 6179f23661591bb4dee89a0bf8e686233e1ba280
          ln -s "$GITHUB_WORKSPACE/node_modules" ../radiance-baseline/node_modules
          node scripts/verify-river-radiance.mjs ../radiance-baseline . evidence/radiance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radiance-final-${{ matrix.suite }}-${{ matrix.device }}
          path: evidence/radiance
          retention-days: 14
