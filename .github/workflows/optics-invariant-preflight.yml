name: Lens invariant GPU preflight
on:
  push:
    branches: ['diagnostic/optics-invariants-2694966-v1']
permissions:
  contents: read
concurrency:
  group: optics-invariants-${{ github.ref }}
  cancel-in-progress: false
env:
  EXPECTED_CANDIDATE_REVISION: ${{ github.sha }}
  ARTEMIS_EVIDENCE: evidence/optics-invariant
jobs:
  capture:
    name: Native optics pixels ${{ matrix.device }} / bloom-${{ matrix.bloom }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
        bloom: [0, 1]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '22.23.3'
      - name: Prepare exact source pair and shared pinned dependencies
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git worktree add --detach "$RUNNER_TEMP/optics-main" ab51029827cf9324eb737673e46c49ab74aa1718
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/optics-main/node_modules"
          echo "BASE_ROOT=$RUNNER_TEMP/optics-main" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0 playwright-core@1.63.0 three@0.164.1 vite@5.4.21
          test ! -e package-lock.json
      - name: Exact source, native hooks and numerical controls
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node scripts/optics-invariant-preflight.mjs
          node scripts/smoke-optics-invariant-preflight.mjs
          node scripts/smoke-optics-crossing.mjs
          node scripts/smoke-optics-partial-release.mjs
          node scripts/smoke-optics-baseline.mjs
          node scripts/smoke-hole-appearance.mjs
          node scripts/smoke-hole-precision.mjs
          npm run build
      - name: Install the pinned Chromium 153 runtime
        timeout-minutes: 5
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: All 31 disk/ring cases and actual native filter proof
        timeout-minutes: 25
        env:
          DEVICE: ${{ matrix.device }}
          BLOOM: ${{ matrix.bloom }}
        run: node scripts/probe-optics-partial-release.mjs
      - name: Recheck protected inputs after GPU execution
        timeout-minutes: 2
        if: always()
        env:
          PREFLIGHT_PHASE: post
        run: node scripts/optics-invariant-preflight.mjs
      - uses: actions/upload-artifact@v4
        timeout-minutes: 2
        if: always()
        with:
          name: invariant-metrics-${{ matrix.device }}-${{ matrix.bloom }}-${{ github.sha }}
          path: |
            evidence/optics-invariant/*.json
            evidence/optics-invariant/depth-fixture-*.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        timeout-minutes: 2
        if: always()
        with:
          name: invariant-saturn-${{ matrix.device }}-${{ matrix.bloom }}-${{ github.sha }}
          path: evidence/optics-invariant/saturn-*.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        timeout-minutes: 2
        if: always()
        with:
          name: invariant-disk-${{ matrix.device }}-${{ matrix.bloom }}-${{ github.sha }}
          path: evidence/optics-invariant/disk-*.png
          if-no-files-found: error
          retention-days: 14
  paired-performance:
    name: Actual-main mobile/direct full five-trial gate
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPTICS_BENCH: '1'
      DEVICE: mobile
      BLOOM: '0'
      PAIRED_CPU_PROFILE: '0'
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '22.23.3'
      - name: Prepare exact source pair and shared pinned dependencies
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git worktree add --detach "$RUNNER_TEMP/optics-main" ab51029827cf9324eb737673e46c49ab74aa1718
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/optics-main/node_modules"
          echo "BASE_ROOT=$RUNNER_TEMP/optics-main" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0 playwright-core@1.63.0 three@0.164.1 vite@5.4.21
          test ! -e package-lock.json
      - name: Validate exact source binding and native benchmark hooks
        timeout-minutes: 3
        run: |
          set -euo pipefail
          node scripts/optics-invariant-preflight.mjs
          node scripts/benchmark-explored-systems.mjs --validate
      - name: Install the pinned Chromium 153 runtime
        timeout-minutes: 5
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Unchanged full five-trial p95 and long-task gates
        id: measure
        timeout-minutes: 30
        run: node scripts/benchmark-explored-systems.mjs . evidence/optics-invariant/paired
      - name: Recheck protected inputs after GPU execution
        timeout-minutes: 2
        if: always()
        env:
          PREFLIGHT_PHASE: post
        run: node scripts/optics-invariant-preflight.mjs
      - name: Validate fresh report identity and full sample schema
        timeout-minutes: 1
        if: success() && steps.measure.outcome == 'success'
        env:
          PREFLIGHT_PHASE: final
          PREFLIGHT_PAIR_REPORT: evidence/optics-invariant/paired/report.json
        run: node scripts/optics-invariant-preflight.mjs
      - uses: actions/upload-artifact@v4
        timeout-minutes: 2
        if: always()
        with:
          name: invariant-paired-mobile-direct-${{ github.sha }}
          path: evidence/optics-invariant/
          if-no-files-found: error
          retention-days: 14
          # A failure remains a failure. No automatic rerun, six-view matrix,
          # threshold waiver or release verdict is attached to this preflight.
